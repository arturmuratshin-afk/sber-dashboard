<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SBER · Анализ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#ffffff; --bg2:#f6f7f8; --fg:#111315; --hint:#7b8189;
    --line:#e6e8eb; --accent:#111315; --up:#1a7f4b; --down:#b3261e;
    --bar:#dfe3e8; --bar2:#b9c0c8;
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --bg:#111315; --bg2:#181b1e; --fg:#f2f4f6; --hint:#8b929a;
      --line:#252a2f; --accent:#f2f4f6; --up:#4ec27f; --down:#ff6b60;
      --bar:#272c31; --bar2:#3a424a;
    }
  }
  html[data-theme="dark"]{
    --bg:#111315; --bg2:#181b1e; --fg:#f2f4f6; --hint:#8b929a;
    --line:#252a2f; --accent:#f2f4f6; --up:#4ec27f; --down:#ff6b60;
    --bar:#272c31; --bar2:#3a424a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden; max-width:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
    font-variant-numeric:tabular-nums; padding:0 0 26px;
  }
  .wrap{padding:14px 16px 0; width:100%; max-width:520px; margin:0 auto}
  .row{display:flex; align-items:baseline; justify-content:space-between; gap:8px;
       flex-wrap:wrap; min-width:0}
  .row > *{min-width:0}
  .h1{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--hint)}
  .muted{color:var(--hint); font-size:12.5px}
  .big{font-size:30px; font-weight:600; letter-spacing:-.02em}
  .chg{font-size:14px; font-weight:500}
  .up{color:var(--up)} .down{color:var(--down)}

  /* переключатель периода */
  .tabs{display:flex; gap:4px; margin-top:14px; border-bottom:1px solid var(--line)}
  .tabs button{
    flex:1; background:none; border:none; color:var(--hint);
    font:inherit; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase;
    padding:9px 2px 8px; cursor:pointer; position:relative; border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tabs button.on{color:var(--fg); border-bottom-color:var(--fg); font-weight:600}

  .card{background:var(--bg2); border-radius:14px; padding:14px; margin-top:12px}
  .card.plain{background:transparent; padding:0; margin-top:20px}
  .k{font-size:11.5px; color:var(--hint); letter-spacing:.04em; text-transform:uppercase}
  .verdict{font-size:13.5px; line-height:1.4; margin-top:10px}
  .tag{display:inline-block; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
       border:1px solid var(--line); border-radius:999px; padding:3px 9px; color:var(--hint);
       white-space:nowrap}
  svg{display:block; width:100%; height:auto}
  .bars{display:flex; align-items:flex-end; gap:5px; height:76px; margin-top:10px; min-width:0}
  .b{flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:flex-end;
     gap:5px; text-align:center}
  .b i{display:block; background:var(--bar); border-radius:3px 3px 0 0; min-height:3px}
  .b i.hot{background:var(--bar2)}
  .b span{font-size:9.5px; color:var(--hint); overflow:hidden; text-overflow:clip;
          white-space:nowrap; line-height:1.2}
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  td{padding:7px 0; border-bottom:1px solid var(--line)}
  td:last-child{text-align:right}
  tr:last-child td{border-bottom:none}
  .prof{overflow:hidden; margin-top:10px}
  .pline{display:flex; align-items:center; gap:8px; height:15px; margin-bottom:2px}
  .pline .lb{width:46px; flex:0 0 46px; font-size:10.5px; color:var(--hint); text-align:right}
  .pline .tr{flex:1 1 auto; min-width:0; height:9px; overflow:hidden}
  .pline .fl{height:9px; background:var(--bar); border-radius:2px}
  .pline.poc .fl{background:var(--accent)}
  .pline.poc .lb{color:var(--fg); font-weight:600}
  .err{color:var(--down); font-size:13px; margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <span class="h1" id="title">SBER · НЕДЕЛЯ</span>
    <span class="muted" id="stamp">—</span>
  </div>

  <div class="row" style="margin-top:8px">
    <div>
      <div class="big" id="px">—</div>
      <div class="muted" id="sub">загрузка…</div>
    </div>
    <div style="text-align:right">
      <div class="chg" id="chg">—</div>
      <div class="muted" id="fut">—</div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tf="hour">Час</button>
    <button data-tf="day">День</button>
    <button data-tf="week" class="on">Неделя</button>
    <button data-tf="month">Месяц</button>
  </div>

  <svg id="spark" viewBox="0 0 480 118" preserveAspectRatio="none" style="margin-top:12px"></svg>

  <div class="card">
    <div class="row"><span class="k" id="volLabel">Объём недели</span>
      <span class="tag" id="volTag">—</span></div>
    <div class="row" style="margin-top:6px; align-items:flex-end">
      <span class="big" style="font-size:24px" id="volNow">—</span>
      <span class="muted" id="volPrev">—</span>
    </div>
    <div class="verdict" id="verdict">—</div>
  </div>

  <div class="card plain">
    <div class="k" id="barsLabel">Объём по дням</div>
    <div class="bars" id="dayBars"></div>
    <div class="muted" style="margin-top:6px" id="dayNote"></div>
  </div>

  <div class="card plain">
    <div class="k" id="profLabel">Профиль недели</div>
    <div class="prof" id="prof"></div>
    <div class="muted" style="margin-top:8px" id="profNote"></div>
  </div>

  <div class="card plain">
    <div class="k">Уровни</div>
    <table id="levels"></table>
  </div>

  <div class="card plain">
    <div class="k">Опционы</div>
    <table id="opts"></table>
  </div>

  <div class="muted" style="margin:18px 0 6px; text-align:center">Не инвестиционная рекомендация</div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  if (tg.colorScheme === "dark") document.documentElement.dataset.theme = "dark";
  try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("bg_color"); } catch(e){}
}
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- конфиг
const TF = {
  hour:  { title:"ЧАС",   volLabel:"Объём часа",    barsLabel:"Объём по 5 минутам",
           profLabel:"Профиль часа",    iv:1,  days:2,  zone:12, step:0.05 },
  day:   { title:"ДЕНЬ",  volLabel:"Объём дня",     barsLabel:"Объём по часам",
           profLabel:"Профиль дня",     iv:10, days:4,  zone:14, step:0.25 },
  week:  { title:"НЕДЕЛЯ",volLabel:"Объём недели",  barsLabel:"Объём по дням",
           profLabel:"Профиль недели",  iv:10, days:17, zone:5,  step:0.25 },
  month: { title:"МЕСЯЦ", volLabel:"Объём месяца",  barsLabel:"Объём по неделям",
           profLabel:"Профиль месяца",  iv:60, days:75, zone:5,  step:0.5 },
};
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август",
                "сентябрь","октябрь","ноябрь","декабрь"];
const WD = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const cache = {};

// ---------------------------------------------------------------- запросы
async function iss(path, params) {
  const u = new URL("https://iss.moex.com" + path);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  u.searchParams.set("iss.meta", "off");
  const r = await fetch(u.toString());
  if (!r.ok) throw new Error("биржа " + r.status);
  return r.json();
}

async function candles(secid, board, market, interval, days, engine = "stock") {
  const from = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
  const path = `/iss/engines/${engine}/markets/${market}/boards/${board}/securities/${secid}/candles.json`;
  let out = [], start = 0;
  for (let i = 0; i < 12; i++) {
    const j = await iss(path, { interval, from, start });
    const c = j.candles || {};
    const cols = c.columns || [], data = c.data || [];
    if (!data.length) break;
    data.forEach(x => { const o = {}; cols.forEach((k, n) => o[k] = x[n]); out.push(o); });
    start += data.length;
    if (data.length < 500) break;
  }
  return out.sort((a, b) => a.begin < b.begin ? -1 : 1);
}

// ---------------------------------------------------------------- утилиты
function P(ts){ // "2026-10-30 10:00:00" — московское время
  const d = +ts.slice(8,10), m = +ts.slice(5,7), y = +ts.slice(0,4);
  const hh = +ts.slice(11,13), mm = +ts.slice(14,16);
  return {y,m,d,hh,mm,date:ts.slice(0,10)};
}
function isoWeek(ts){
  const p = P(ts);
  const t = new Date(Date.UTC(p.y, p.m - 1, p.d));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return t.getUTCFullYear() + "-" + String(Math.ceil(((t - y0)/864e5 + 1)/7)).padStart(2,"0");
}
const MON = b => b.begin.slice(0,7);
const DAY = b => b.begin.slice(0,10);
const HOUR = b => b.begin.slice(0,13);
const FIVE = b => b.begin.slice(0,13) + ":" + String(Math.floor(+b.begin.slice(14,16)/5)*5).padStart(2,"0");

function periodKey(tf, b){
  if (tf === "hour") return HOUR(b);
  if (tf === "day") return DAY(b);
  if (tf === "week") return isoWeek(b.begin);
  return MON(b);
}
function bucketKey(tf, b){
  if (tf === "hour") return FIVE(b);
  if (tf === "day") return HOUR(b);
  if (tf === "week") return DAY(b);
  // месяц — по неделям месяца
  const p = P(b.begin);
  return "н" + Math.min(5, Math.ceil(p.d / 7));
}
function bucketRel(tf, b){
  const p = P(b.begin);
  if (tf === "hour") return String(Math.floor(p.mm/5));
  if (tf === "day") return String(p.hh);
  if (tf === "week") return String((new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay()+6)%7);
  return String(Math.min(5, Math.ceil(p.d/7)));
}
function bucketName(tf, key, b){
  if (tf === "hour") return key.slice(11,16);
  if (tf === "day") return key.slice(11,13) + ":00";
  if (tf === "week") { const p = P(b.begin); return WD[new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay()]; }
  return key;
}
function periodLabel(tf, bars, prevBars, nBuckets){
  if (!bars.length) return "—";
  const a = bars[0], z = bars[bars.length-1];
  if (tf === "hour") return "час " + a.begin.slice(11,16) + "–" + z.begin.slice(11,16) +
    " · " + P(a.begin).d + "." + String(P(a.begin).m).padStart(2,"0");
  if (tf === "day") { const p = P(a.begin); return WD[new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay()] +
    " " + String(p.d).padStart(2,"0") + "." + String(p.m).padStart(2,"0"); }
  if (tf === "week") { const p1 = P(a.begin), p2 = P(z.begin);
    return p1.d + "." + p1.m + " – " + p2.d + "." + p2.m; }
  const p = P(a.begin);
  return MONTHS[p.m-1] + " " + p.y;
}
function profile(bars, step){
  const map = new Map();
  bars.forEach(b => {
    const v = +b.volume || 0; if (v <= 0) return;
    const tp = (+b.high + +b.low + +b.close) / 3;
    const k = +(Math.round(tp / step) * step).toFixed(2);
    map.set(k, (map.get(k) || 0) + v);
  });
  if (!map.size) return null;
  const keys = [...map.keys()].sort((a,b)=>a-b);
  const total = [...map.values()].reduce((a,b)=>a+b,0);
  let poc = keys[0];
  keys.forEach(k => { if (map.get(k) > map.get(poc)) poc = k; });
  let lo = keys.indexOf(poc), hi = lo, acc = map.get(poc);
  while (acc < total * 0.7 && (lo > 0 || hi < keys.length-1)) {
    const l = lo > 0 ? map.get(keys[lo-1]) : -1;
    const r = hi < keys.length-1 ? map.get(keys[hi+1]) : -1;
    if (r >= l) { hi++; acc += map.get(keys[hi]); } else { lo--; acc += map.get(keys[lo]); }
  }
  return {map, keys, poc, val: keys[lo], vah: keys[hi], total};
}
const mln = x => (x/1e6).toFixed(1);
const volFmt = x => x >= 1e6 ? (x/1e6).toFixed(1) + " млн" : Math.round(x/1e3) + " тыс";
const volShort = x => x >= 1e6 ? (x/1e6).toFixed(1) : Math.round(x/1e3) + "к";
const f2 = x => x.toFixed(2);
const dec = (pts) => pts < 3 ? 1 : 2;
const fmtPx = x => x.toFixed(2);

// ---------------------------------------------------------------- график
function drawSpark(bars, prof){
  const svg = $("spark");
  if (!bars.length) { svg.innerHTML = ""; return; }
  const W = 480, H = 118, pad = 6;
  const ys = bars.map(b => +b.close);
  const hi = Math.max(...ys), lo = Math.min(...ys), span = (hi-lo)||1;
  const X = i => pad + i*(W-pad*2)/(bars.length-1);
  const Y = v => pad + (hi-v)/span*(H-pad*2);
  const d = ys.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  let g = "";
  if (prof) {
    const yT = Y(prof.vah), yB = Y(prof.val);
    g += `<rect x="0" y="${Math.min(yT,yB).toFixed(1)}" width="${W}" height="${Math.abs(yB-yT).toFixed(1)}" fill="currentColor" opacity="0.06"/>`;
    const yp = Y(prof.poc).toFixed(1);
    g += `<line x1="0" x2="${W}" y1="${yp}" y2="${yp}" stroke="currentColor" stroke-opacity=".3" stroke-dasharray="3 3" stroke-width="1"/>`;
  }
  svg.innerHTML = g +
    `<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${X(ys.length-1).toFixed(1)}" cy="${Y(ys[ys.length-1]).toFixed(1)}" r="2.6" fill="currentColor"/>`;
}

// ---------------------------------------------------------------- расчёт
function analyze(tf, small){
  const cfg = TF[tf];
  if (!small.length) throw new Error("нет данных");

  // группируем по периодам
  const periods = new Map();
  small.forEach(b => {
    const k = periodKey(tf, b);
    if (!periods.has(k)) periods.set(k, []);
    periods.get(k).push(b);
  });
  const keys = [...periods.keys()].sort();
  if (keys.length < 2) throw new Error("мало истории");

  const cur = periods.get(keys[keys.length-1]);
  const prev = periods.get(keys[keys.length-2]);

  // корзины внутри периода
  const bk = new Map();
  cur.forEach(b => {
    const k = bucketKey(tf, b);
    if (!bk.has(k)) bk.set(k, {vol:0, bars:[], sample:b, rel:bucketRel(tf, b)});
    const o = bk.get(k);
    o.vol += +b.volume || 0;
    o.bars.push(b);
    o.sample = o.sample;
  });
  const buckets = [...bk.entries()].map(([k, v]) => ({key:k, ...v}))
    .sort((a,b)=> a.key < b.key ? -1 : 1);

  // сравнение с прошлым периодом — по позиции внутри периода
  const pbk = new Map();
  prev.forEach(b => {
    const k = bucketRel(tf, b);
    pbk.set(k, (pbk.get(k)||0) + (+b.volume || 0));
  });
  const prevSameKeys = buckets.map(x => x.rel).filter(k => pbk.has(k));
  const prevSame = prevSameKeys.reduce((s,k)=> s + pbk.get(k), 0);

  const curVol = cur.reduce((s,b)=> s + (+b.volume||0), 0);
  const prevVol = prev.reduce((s,b)=> s + (+b.volume||0), 0);
  const complete = buckets.filter(x => pbk.has(x.rel)).length;
  const total = buckets.length;
  const ratioAll = prevVol ? curVol/prevVol*100 : 0;
  const ratioSame = prevSame ? curVol/prevSame*100 : 0;
  // прогноз на весь период, если он не закрыт
  const forecast = prevSame ? (curVol/prevSame) * prevVol : curVol;

  const o = +cur[0].open, c = +cur[cur.length-1].close;
  const hi = Math.max(...cur.map(b=>+b.high));
  const lo = Math.min(...cur.map(b=>+b.low));
  const chg = o ? (c/o-1)*100 : 0;
  const pos = hi > lo ? (c-lo)/(hi-lo)*100 : 50;

  const prof = profile(cur, cfg.step);

  // объём в верхней трети против прошлого периода
  let above = 0, below = 0, pAbove = 0, pBelow = 0;
  if (hi > lo) {
    const third = (hi-lo)/3;
    cur.forEach(b => {
      const v = +b.volume||0; if (v<=0) return;
      const tp = (+b.high + +b.low + +b.close)/3;
      if (tp >= hi-third) above += v; else if (tp <= lo+third) below += v;
    });
  }
  const phi = Math.max(...prev.map(b=>+b.high)), plo = Math.min(...prev.map(b=>+b.low));
  if (phi > plo) {
    const t3 = (phi-plo)/3;
    prev.forEach(b => {
      const v = +b.volume||0; if (v<=0) return;
      const tp = (+b.high + +b.low + +b.close)/3;
      if (tp >= phi-t3) pAbove += v; else if (tp <= plo+t3) pBelow += v;
    });
  }

  const share = above+below ? above/(above+below)*100 : null;
  const pshare = pAbove+pBelow ? pAbove/(pAbove+pBelow)*100 : null;

  const volRatio = prevSame ? ratioSame : ratioAll;
  const word = volRatio >= 110 ? "растёт" : volRatio >= 90 ? "стабилен" : "падает";

  let verdict;
  if (chg > 0.3 && volRatio >= 105) verdict = "Рост подтверждён объёмом.";
  else if (chg > 0.3 && volRatio < 95) verdict = "Рост на слабом объёме — покупатели не поддерживают движение.";
  else if (chg < -0.3 && volRatio >= 105) verdict = "Падение с объёмом — продают.";
  else if (chg < -0.3) verdict = "Падение на низком объёме.";
  else verdict = "Боковик, объём " + word + ".";

  if (pshare !== null && share !== null) {
    const d = share - pshare;
    if (Math.abs(d) < 5) verdict += " Объём на хаях не меняется — подтверждения нет.";
    else if (d >= 5) verdict += " Объём смещается к верхам — покупатели держат.";
    else verdict += " Объём уходит от верхов — рост без поддержки.";
  }

  return {tf, cur, prev, buckets, curVol, prevVol, prevSame, complete, total,
          ratioAll, ratioSame, forecast, o, c, hi, lo, chg, pos, prof,
          share, pshare, word, verdict, volRatio,
          label: periodLabel(tf, cur, prev, total)};
}

// ---------------------------------------------------------------- отрисовка
function render(r){
  const cfg = TF[r.tf];
  $("title").textContent = "SBER · " + cfg.title;
  $("volLabel").textContent = cfg.volLabel;
  $("barsLabel").textContent = cfg.barsLabel;
  $("profLabel").textContent = cfg.profLabel;

  $("px").textContent = fmtPx(r.c);
  $("chg").textContent = (r.chg>=0?"+":"") + r.chg.toFixed(2) + "%";
  $("chg").className = "chg " + (r.chg>=0?"up":"down");
  $("sub").textContent = r.label;

  $("volNow").textContent = volFmt(r.curVol);
  $("volPrev").textContent = "прошлый " + volFmt(r.prevVol) + " · " +
    Math.round(r.prevSame ? r.ratioSame : r.ratioAll) + "%";
  $("volTag").textContent = r.word;
  $("verdict").textContent = r.verdict;

  // бары
  const mx = Math.max(...r.buckets.map(b=>b.vol));
  const n = r.buckets.length;
  const showVal = n <= 8;
  const every = Math.ceil(n / 8);
  $("dayBars").innerHTML = r.buckets.map((b,i) => {
    const h = Math.max(4, b.vol/mx*62);
    const hot = i === n-1 ? "hot" : "";
    const nm = r.tf === "month" ? b.key : bucketName(r.tf, b.key, b.sample);
    const lab = (i % every === 0) ? nm : "";
    const val = showVal ? volShort(b.vol) : "";
    return `<div class="b"><span>${val}</span><i class="${hot}" style="height:${h.toFixed(0)}px"></i><span>${lab}</span></div>`;
  }).join("");

  const lastB = r.buckets[r.buckets.length-1];
  $("dayNote").textContent = r.complete < r.total
    ? `${r.complete} из ${r.total} отрезков с базой для сравнения`
    : `последний отрезок ${volFmt(lastB.vol)} · пик ${volFmt(mx)}`;

  drawSpark(r.cur, r.prof);

  if (r.prof) {
    const shown = r.prof.keys.filter(k => k >= r.lo - cfg.step && k <= r.hi + cfg.step);
    const step = Math.max(1, Math.ceil(shown.length / 16));
    const sel = shown.filter((_,i)=> i % step === 0);
    const mmx = Math.max(...sel.map(k => r.prof.map.get(k)));
    $("prof").innerHTML = sel.slice().reverse().map(k => {
      const w = r.prof.map.get(k)/mmx*100;
      const isPoc = Math.abs(k - r.prof.poc) < 1e-9;
      return `<div class="pline ${isPoc?"poc":""}"><div class="lb">${f2(k)}</div>
        <div class="tr"><div class="fl" style="width:${w.toFixed(0)}%"></div></div></div>`;
    }).join("");
    $("profNote").textContent = `POC ${f2(r.prof.poc)} · зона 70% ${f2(r.prof.val)} – ${f2(r.prof.vah)}`;
  }

  const rows = [
    ["Максимум", r.hi],
    ["Закрытие", r.c],
    ["POC", r.prof ? r.prof.poc : r.c],
    ["Минимум", r.lo],
  ];
  $("levels").innerHTML = rows.map(([k,v]) =>
    `<tr><td>${k}</td><td>${f2(v)}</td></tr>`).join("") +
    `<tr><td>Позиция в диапазоне</td><td>${r.pos.toFixed(0)}%</td></tr>` +
    (r.share !== null ? `<tr><td>Объём в верхней трети</td><td>${r.share.toFixed(0)}%</td></tr>` : "") +
    (r.pshare !== null ? `<tr><td>Было в прошлом периоде</td><td>${r.pshare.toFixed(0)}%</td></tr>` : "");
}

// ---------------------------------------------------------------- опционы
async function loadOptions(){
  try {
    const j = await iss("/iss/engines/futures/markets/options/boards/ROPD/securities.json", {});
    const md = j.marketdata, sc = j.securities;
    const oiIdx = md.columns.indexOf("OPENPOSITION");
    const M = {};
    md.data.forEach(r => M[r[0]] = r[oiIdx]);
    const today = new Date().toISOString().slice(0,10);
    const rows = sc.data.map(r => { const o={}; sc.columns.forEach((c,i)=>o[c]=r[i]); return o; })
      .filter(s => s.ASSETCODE === "SBRF" && String(s.SHORTNAME||"").startsWith("SBERP") &&
                   s.LASTTRADEDATE && s.LASTTRADEDATE >= today);
    const byExp = {};
    rows.forEach(s => (byExp[s.LASTTRADEDATE] = byExp[s.LASTTRADEDATE] || []).push(s));
    const exps = Object.keys(byExp).sort().slice(0,2);
    let html = "";
    exps.forEach(e => {
      const ser = byExp[e];
      const co = ser.filter(s=>s.OPTIONTYPE==="C").reduce((a,s)=>a+(M[s.SECID]||0),0);
      const po = ser.filter(s=>s.OPTIONTYPE==="P").reduce((a,s)=>a+(M[s.SECID]||0),0);
      const fnum = x => Math.round(x).toLocaleString("ru-RU");
      html += `<tr><td>${e.slice(8,10)}.${e.slice(5,7)}</td><td>PCR ${(po/co||0).toFixed(2)} · call ${fnum(co)} / put ${fnum(po)}</td></tr>`;
    });
    $("opts").innerHTML = html || `<tr><td>нет данных</td><td>—</td></tr>`;
  } catch(e) {
    $("opts").innerHTML = `<tr><td>опционы</td><td>недоступны</td></tr>`;
  }
}

// ---------------------------------------------------------------- запуск
let current = "week";

async function load(tf, force){
  current = tf;
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.tf === tf));
  $("sub").textContent = "загрузка…";
  try {
    const cfg = TF[tf];
    const key = "SBER-" + cfg.iv + "-" + cfg.days;
    if (force || !cache[key]) {
      cache[key] = await candles("SBER", "TQBR", "shares", cfg.iv, cfg.days);
    }
    const r = analyze(tf, cache[key]);
    render(r);
  } catch (e) {
    $("sub").textContent = "ошибка: " + e.message;
  }
  $("stamp").textContent = new Date().toLocaleTimeString("ru-RU",
    {hour:"2-digit", minute:"2-digit"}) + " МСК";
}

document.querySelectorAll("#tabs button").forEach(b =>
  b.addEventListener("click", () => {
    if (current !== b.dataset.tf) {
      const u = new URL(location.href);
      u.searchParams.set("tf", b.dataset.tf);
      try { history.replaceState(null, "", u); } catch(e) {}
      load(b.dataset.tf);
    }
  }));

(async () => {
  try {
    const wf = await candles("SRZ6", "RFUD", "forts", 24, 10, "futures");
    if (wf.length) $("fut").textContent = "SRZ6 " + (+wf[wf.length-1].close).toFixed(0);
  } catch(e){}
  const q = new URLSearchParams(location.search).get("tf");
  load(q && TF[q] ? q : "week");
  loadOptions();
})();
</script>
